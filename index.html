<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Reportes</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Barra Lateral -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-chart-line logo-icon"></i>
        <h2>ESPACIA <span class="badge">Reportes</span></h2>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Buscar reporte...">
      </div>

      <nav class="sidebar-nav">
        <ul id="report-list">
          <li class="loading">Cargando reportes...</li>
        </ul>
      </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
      <header class="top-bar">
        <h1 id="current-report-title">Selecciona un Reporte</h1>
        <div class="actions">
          <button id="reload-btn" title="Recargar Reporte"><i class="fa-solid fa-rotate-right"></i></button>
          <button id="fullscreen-btn" title="Pantalla Completa"><i class="fa-solid fa-expand"></i></button>
        </div>
      </header>

      <div class="content-body">
        <div id="welcome-message" class="welcome-card">
          <i class="fa-solid fa-file-invoice-dollar welcome-icon"></i>
          <h2>Bienvenido al Panel de Reportes</h2>
          <p>Selecciona un módulo en el menú lateral para interactuar o imprimir el reporte correspondiente.</p>
        </div>
        <iframe id="report-frame" class="report-frame hidden" src="" frameborder="0"></iframe>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
