<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Reportes</title>
  <!-- CSS Externo -->
  <link rel="stylesheet" href="css/style.css">
  <!-- FontAwesome (si usas iconos en la barra lateral) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="dashboard-container">
    <!-- Barra Lateral -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-chart-line logo-icon"></i>
        <h2>Reportes <span class="badge">v1.0</span></h2>
        <button id="sidebar-toggle-btn" title="Colapsar menú">
          <i class="fa-solid fa-angles-left"></i>
        </button>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Buscar reporte...">
      </div>

      <nav class="sidebar-nav">
        <ul id="report-list">
          <li class="loading">Cargando reportes...</li>
        </ul>
      </nav>
    </aside>

    <!-- Área Principal de Contenido -->
    <main class="main-content">
      <header class="top-bar">
        <h1 id="current-report-title">Selecciona un reporte</h1>
        <div class="actions">
          <button id="reload-btn" title="Recargar"><i class="fa-solid fa-rotate-right"></i> Recargar</button>
          <button id="fullscreen-btn" title="Pantalla Completa"><i class="fa-solid fa-expand"></i> Pantalla Completa</button>
        </div>
      </header>

      <section class="content-body">
        <div id="welcome-message" class="welcome-card">
          <i class="fa-regular fa-folder-open welcome-icon"></i>
          <h3>Panel de Control</h3>
          <p>Selecciona cualquier reporte de la barra lateral para visualizarlo.</p>
        </div>
        <iframe id="report-frame" class="report-frame hidden" src=""></iframe>
      </section>
    </main>
  </div>

  <!-- JavaScript Externo -->
  <script src="js/main.js"></script>
</body>
</html>
