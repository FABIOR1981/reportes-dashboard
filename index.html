<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Reportes</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#171c26">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- CSS Externo -->
  <link rel="stylesheet" href="css/style.css">
  <!-- FontAwesome (si usas iconos en la barra lateral) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="dashboard-container">
    <!-- Fondo oscuro para cerrar el menú al tocar afuera (solo mobile) -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Barra Lateral -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-chart-line logo-icon"></i>
        <h2>Reportes <span class="badge">v1.0</span></h2>
        <button id="sidebar-toggle-btn" title="Colapsar menú">
          <i class="fa-solid fa-angles-left"></i>
        </button>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Buscar reporte...">
      </div>

      <nav class="sidebar-nav">
        <ul id="report-list">
          <li class="loading">Cargando reportes...</li>
        </ul>
      </nav>
    </aside>

    <!-- Área Principal de Contenido -->
    <main class="main-content">
      <header class="top-bar">
        <button id="mobile-menu-btn" class="icon-btn" title="Abrir menú" aria-label="Abrir menú">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 id="current-report-title">Selecciona un reporte</h1>
        <div class="actions">
          <span id="langtool-status-icon" class="langtool-status-icon langtool-status-unknown" title="Corrector ortográfico: estado desconocido">
            <i class="fa-solid fa-circle"></i>
          </span>
          <button id="reload-btn" class="icon-btn" title="Recargar" aria-label="Recargar"><i class="fa-solid fa-rotate-right"></i></button>
          <button id="fullscreen-btn" class="icon-btn" title="Pantalla Completa" aria-label="Pantalla Completa"><i class="fa-solid fa-expand"></i></button>
        </div>
      </header>

      <section class="content-body">
        <div id="welcome-message" class="welcome-card">
          <i class="fa-regular fa-folder-open welcome-icon"></i>
          <h3>Panel de Control</h3>
          <p>Selecciona cualquier reporte de la barra lateral para visualizarlo.</p>
        </div>
        <iframe id="report-frame" class="report-frame hidden" src=""></iframe>
      </section>
    </main>
  </div>

  <!-- JavaScript Externo -->
  <script src="js/main.js"></script>
</body>
</html>
