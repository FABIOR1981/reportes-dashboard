<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe Genérico</title>
  <!-- Estilos compartidos de botonera -->
  <link rel="stylesheet" href="../_shared/botonera.css">
  <!-- Estilos específicos del informe -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- BOTONERA COMPARTIDA -->
  <div class="btn-toolbar" id="actions">
    <button class="btn btn-primary" data-action="pdf" aria-label="Descargar PDF">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="tooltip">Descargar PDF</span>
    </button>
    <button class="btn btn-primary" data-action="word" aria-label="Descargar Word">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span class="tooltip">Descargar Word</span>
    </button>
    <button class="btn btn-secondary" data-action="save" aria-label="Guardar datos">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span class="tooltip">Guardar datos</span>
    </button>
    <button class="btn btn-secondary" data-action="load" aria-label="Cargar datos">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span class="tooltip">Cargar datos</span>
    </button>
    <input type="file" id="loadInput" accept="application/json,.json" hidden>
    <button class="btn btn-tertiary" data-action="spellcheck" aria-label="Revisar ortografía">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span class="tooltip">Revisar ortografía</span>
    </button>
    <button class="btn btn-danger" data-action="reset" aria-label="Limpiar formulario">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      <span class="tooltip">Limpiar formulario</span>
    </button>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="container">

    <!-- PANEL FORMULARIO -->
    <div class="form-panel">
      <h2>Datos del Informe</h2>

      <!-- Status / ortografía / diccionario: SIEMPRE dentro de .form-panel,
           nunca como hermano de .container a nivel de <body> (rompe el layout,
           ver bug de agosto 2026). -->
      <div id="status"></div>
      <div id="spellPanel"></div>
      <div id="dicPanel">
        <label>Diccionario técnico personalizado (palabras que nunca se marcan como error)</label>
        <div id="dicAddRow">
          <input type="text" id="dicInput" placeholder="Agregar palabra...">
          <button type="button" id="dicAddBtn">+ Agregar</button>
        </div>
        <div id="dicList"></div>
      </div>

      <div class="form-group">
        <label for="tituloInforme">Título del Informe</label>
        <input type="text" id="tituloInforme" value="INFORME GENERAL">
      </div>

      <div class="form-group">
        <label for="destinatario">Destinatario / Institución</label>
        <input type="text" id="destinatario" placeholder="Ej: Dirección de RRHH" value="Dirección de Recursos Humanos">
      </div>

      <div class="form-group">
        <label for="fechaInforme">Fecha</label>
        <input type="date" id="fechaInforme">
      </div>

      <div class="form-group">
        <label for="resumen">
          Resumen / Antecedentes (opcional)
          <input type="checkbox" id="chkResumen" checked>
        </label>
        <textarea id="resumen" rows="4" placeholder="Escriba un resumen breve...">El presente informe fue elaborado a solicitud de la Dirección de Recursos Humanos, con el objetivo de relevar el estado actual del proceso evaluado y presentar las observaciones correspondientes.</textarea>
      </div>

      <div class="form-group">
        <label for="desarrollo">
          Desarrollo / Observaciones (opcional)
          <input type="checkbox" id="chkDesarrollo" checked>
        </label>
        <textarea id="desarrollo" rows="8" placeholder="Detalle las observaciones...">Durante el período analizado se relevó la información disponible mediante entrevistas, revisión de documentación y observación directa. Los datos recabados permiten identificar fortalezas y aspectos a mejorar en el proceso, los cuales se detallan en las secciones siguientes.</textarea>
      </div>

      <!-- Orden narrativo coherente con UDE / SM Consultores:
           contenido → aspectos evaluados (evidencia detallada) → conclusión
           → clasificación final (siempre la ÚLTIMA sección, es el veredicto). -->
      <fieldset class="form-fieldset">
        <legend>Aspectos Evaluados (Opcional)</legend>
        <div id="aspectosContainer"></div>
        <button type="button" id="addAspectoBtn" class="btn btn-secondary">+ Agregar Aspecto</button>
      </fieldset>

      <div class="form-group">
        <label for="conclusion">
          Conclusión (opcional)
          <input type="checkbox" id="chkConclusion" checked>
        </label>
        <textarea id="conclusion" rows="4" placeholder="Conclusiones o recomendaciones...">En base a lo relevado, se concluye que el desempeño general es satisfactorio, destacándose la organización y el cumplimiento de los plazos establecidos. Se recomienda reforzar los canales de comunicación interna.</textarea>
      </div>

      <fieldset class="form-fieldset">
        <legend>Clasificación</legend>
        <label><input type="checkbox" id="chkClasificacion" checked> Mostrar clasificación</label>
        <br><br>
        <label><input type="radio" name="clasificacion" value=""> Sin especificar</label>
        <label><input type="radio" name="clasificacion" value="Recomendable"> Recomendable</label>
        <label><input type="radio" name="clasificacion" value="Con observaciones" checked> Con observaciones</label>
        <label><input type="radio" name="clasificacion" value="No recomendable"> No recomendable</label>

        <!-- Solo visible cuando la clasificación es "Con observaciones" -->
        <div class="form-group" id="clasifObsWrapper" style="display:block; margin-top:12px;">
          <label for="clasifObservaciones">Observaciones</label>
          <textarea id="clasifObservaciones" rows="3" placeholder="Detalle las observaciones que motivan esta clasificación...">Se sugiere realizar un seguimiento en los próximos tres meses para verificar la implementación de las recomendaciones planteadas.</textarea>
        </div>
      </fieldset>
    </div>
    <!-- /.form-panel -->

    <!-- VISTA PREVIA (A4) -->
    <div class="preview-panel">
      <div class="page-a4" id="pdfPreview">
        <div class="report-header">
          <h1 class="report-title" id="prevTitulo">INFORME GENERAL</h1>
          <div class="report-meta">
            <span id="prevDestinatario"></span>
            <span id="prevFecha"></span>
          </div>
        </div>
        <div class="report-section" id="secResumen">
          <h3>Resumen / Antecedentes</h3>
          <div class="report-body" id="prevResumen"></div>
        </div>
        <div class="report-section" id="secDesarrollo">
          <h3>Desarrollo / Observaciones</h3>
          <div class="report-body" id="prevDesarrollo"></div>
        </div>
        <div class="report-section" id="secAspectos">
          <h3>Aspectos Evaluados</h3>
          <div id="aspectosOutContainer"></div>
        </div>
        <div class="report-section" id="secConclusion">
          <h3>Conclusión</h3>
          <div class="report-body" id="prevConclusion"></div>
        </div>
        <div class="report-section" id="secClasificacion">
          <h3>Clasificación</h3>
          <div id="prevClasificacion" class="classification-box"></div>
          <div id="prevClasifObservaciones" class="report-body classification-obs"></div>
        </div>
      </div>
    </div>
    <!-- /.preview-panel -->

  </div>
  <!-- /.container -->

  <!-- Librerías de exportación (UMD) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>

  <!-- Lógica compartida y del informe -->
  <script src="../_shared/botonera.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
