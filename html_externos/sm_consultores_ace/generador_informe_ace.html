<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SM Consultores A.C.E. - Gráfico de Competencias</title>
  <link rel="stylesheet" href="../_shared/botonera.css">
  <link rel="stylesheet" href="css/style_ace.css">
  <!-- Chart.js para el gráfico de doble barra -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Botonera y utilidades compartidas -->
  <div class="btn-toolbar" id="actions"></div>
  <div id="status"></div>
  <div id="spellPanel"></div>
  <div id="dicPanel" style="display:none;">
    <label>Diccionario técnico personalizado...</label>
    <div id="dicAddRow">
      <input type="text" id="dicInput" placeholder="Agregar palabra...">
      <button type="button" id="dicAddBtn">+ Agregar</button>
    </div>
    <div id="dicList"></div>
  </div>

  <div class="dashboard-container">
    <!-- Panel Izquierdo: Formulario -->
    <div class="form-panel">
      <h2>Datos del Informe A.C.E.</h2>
      
      <div class="form-group">
        <label for="nombreCandidato">Nombre del Postulante</label>
        <input type="text" id="nombreCandidato" placeholder="Ej. Juan Pérez">
      </div>
      
      <div class="form-group">
        <label for="cargoPostula">Cargo Evaluado</label>
        <input type="text" id="cargoPostula" placeholder="Ej. Encargado de Sucursal">
      </div>

      <div class="form-group">
        <label for="fortalezas">Fortalezas</label>
        <textarea id="fortalezas" placeholder="Describa las fortalezas detectadas..."></textarea>
      </div>

      <div class="form-group">
        <label for="debilidades">Debilidades</label>
        <textarea id="debilidades" placeholder="Describa las debilidades u oportunidades de mejora..."></textarea>
      </div>

      <h3 class="section-title">Competencias Evaluadas (13)</h3>
      <div id="competencias-container">
        <!-- Los 13 inputs se inyectan dinámicamente desde script_ace.js -->
      </div>
    </div>

    <!-- Panel Derecho: Vista Previa y PDF -->
    <div class="main-content">
      <div class="preview-wrapper" id="informe-preview">
        <div class="informe-page">
           <div class="informe-header">
             <h1>SM Consultores A.C.E.</h1>
             <h2>Informe de Evaluación Psicolaboral</h2>
           </div>
           
           <div class="informe-datos">
             <p><strong>Candidato:</strong> <span id="prev_nombre"></span></p>
             <p><strong>Cargo:</strong> <span id="prev_cargo"></span></p>
           </div>
           
           <div class="informe-seccion">
             <h3>Fortalezas</h3>
             <p id="prev_fortalezas"></p>
           </div>
           
           <div class="informe-seccion">
             <h3>Debilidades / Áreas de Mejora</h3>
             <p id="prev_debilidades"></p>
           </div>
           
           <!-- Las competencias no se listan en texto, directo al gráfico -->
           <div class="informe-seccion grafico-seccion">
             <h3>Perfil de Competencias</h3>
             <canvas id="graficoCompetencias" width="650" height="350"></canvas>
           </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts base del sistema -->
  <script src="../_shared/vendor/jspdf.umd.min.js"></script>
  <script src="../_shared/vendor/html2canvas.min.js"></script>
  <script src="../_shared/vendor/docx.umd.min.js"></script>
  <script src="../_shared/diccionario-base.js"></script>
  <script src="../_shared/botonera.js"></script>
  <!-- Script específico de la vista A.C.E. -->
  <script src="js/script_ace.js"></script>
</body>
</html>
