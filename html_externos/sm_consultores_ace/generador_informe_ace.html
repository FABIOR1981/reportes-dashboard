<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador Informe ACE</title>
  
  <!-- Estilos compartidos e individuales -->
  <link rel="stylesheet" href="../_shared/botonera.css">
  <link rel="stylesheet" href="css/style_ace.css">
</head>
<body>
  
  <!-- Botonera centralizada -->
  <div class="btn-toolbar" id="actions"></div>
  <div id="status"></div>

  <div class="app-container">
    <!-- PANEL IZQUIERDO: Formulario -->
    <div class="form-panel">
      <h2>Datos del Informe ACE</h2>
      <div class="form-group">
        <label for="nombre">Nombre del Evaluado</label>
        <input type="text" id="nombre" class="guardable ortografia" placeholder="Ej. Juan Pérez">
      </div>
      <div class="form-group">
        <label for="puesto">Puesto</label>
        <input type="text" id="puesto" class="guardable ortografia">
      </div>
      <div class="form-group">
        <label for="observaciones">Observaciones / Resumen</label>
        <textarea id="observaciones" class="guardable ortografia" rows="6"></textarea>
      </div>
      <!-- Panel de ortografía inyectado por Botonera -->
      <div id="spellPanel"></div>
    </div>

    <!-- PANEL DERECHO: Vista Previa -->
    <div class="preview-panel">
      <div id="page1" class="hoja-a4">
        <img src="img/cabezal.png" alt="Cabezal" class="cabezal-img">
        <h1 class="titulo-informe">INFORME PSICOLABORAL ACE</h1>
        
        <div class="datos-personales">
          <p><strong>Nombre:</strong> <span id="prev-nombre"></span></p>
          <p><strong>Puesto:</strong> <span id="prev-puesto"></span></p>
        </div>

        <div class="seccion">
          <h3>OBSERVACIONES</h3>
          <p id="prev-observaciones"></p>
        </div>

        <!-- Contenedor del Gráfico / Diana -->
        <div class="seccion grafico-container">
          <h3>PERFIL DE COMPETENCIAS</h3>
          <div id="graficoAspectosContainer">
            <img src="img/diana.png" alt="Diana de Evaluación" class="diana-img">
            <!-- SVG dinámico si aplica, inyectado aquí -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Librerías locales -->
  <script src="../_shared/vendor/docx.umd.min.js"></script>
  <script src="../_shared/botonera.js"></script>
  
  <!-- Scripts Modulares -->
  <script src="js/utils.js"></script>
  <script src="js/vistaPrevia.js"></script>
  <script src="js/grafico.js"></script>
  <script src="js/exportPdf.js"></script>
  <script src="js/exportWord.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
