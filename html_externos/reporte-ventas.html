<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Reporte de Ventas</title>
<style>
  body{font-family:system-ui, sans-serif; max-width:640px; margin:40px auto; color:#222;}
  h1{font-size:22px;}
  label{display:block; margin-top:14px; font-size:13px; color:#555;}
  input{width:100%; padding:8px; margin-top:4px; box-sizing:border-box;}
  button{margin-top:20px; padding:10px 16px; cursor:pointer;}
</style>
</head>
<body>
  <h1>Reporte de Ventas — ejemplo</h1>
  <p>Este es un archivo de ejemplo. Reemplazalo por tus HTML reales dentro de <code>html_externos/</code>.</p>

  <label>Cliente
    <input type="text" placeholder="Nombre del cliente" />
  </label>
  <label>Monto
    <input type="number" placeholder="0.00" />
  </label>

  <button onclick="window.print()">Imprimir reporte</button>
</body>
</html>
